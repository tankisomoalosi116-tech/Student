<input type="email" id="email" name="email"><br><br>

<label for="expense">Monthly Expense:</label>
<input type="number" id="expense" name="expense"><br><br>

<label for="category">Expense Category:</label>
<select id="category">
<option>Food</option>
<option>Transport</option>
<option>Books</option>

</select>

<br><br>

</form>
